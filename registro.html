<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — UDP Grand Casino</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="sitio">
    <h1>UDP Grand Casino</h1>
    <div class="header-acciones">
      <a class="boton-contorno" href="index.html">Iniciar sesión</a>
    </div>
  </header>

  <main>
    <h2>Crear cuenta</h2>

    <form action="#" method="post">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required
               placeholder="Tu nombre completo">
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required
               placeholder="tucorreo@ejemplo.com">
      </div>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required
               placeholder="Elige un nombre de usuario">
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required
               minlength="8" placeholder="Mínimo 8 caracteres">
      </div>

      <div class="campo">
        <label for="confirmar-contrasena">Confirmar contraseña</label>
        <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required
               minlength="8" placeholder="Repite tu contraseña">
      </div>

      <button type="submit">Crear cuenta</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil </p>
  </footer>

</body>
</html>
