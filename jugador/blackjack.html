<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14202b">
  <title>Blackjack — UDP Grand Casino</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icono-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body x-data="pagina('jugador')">

  <div class="aviso-conexion" role="status" x-data="avisoConexion" x-show="sinConexion" x-cloak
       @online.window="actualizar()" @offline.window="actualizar()">
    Sin conexión: la aplicación sigue funcionando con los datos guardados en este dispositivo.
  </div>

  <p class="verificando" x-show="verificando">Verificando sesión…</p>

  <template x-if="autorizado">
    <div class="aplicacion">

      <header class="sitio">
        <h1><a href="/jugador/dashboard.html">UDP Grand Casino</a></h1>
        <p class="usuario">Hola, <span x-text="usuario.nombre"></span></p>
        <nav class="principal" aria-label="Navegación de jugador" x-data="navegacion('jugador')" :class="{ 'abierto': abierto }">
          <button type="button" class="menu-boton secundario" @click="alternar()"
                  :aria-expanded="abierto" aria-controls="menu-principal">Menú</button>
          <ul id="menu-principal">
            <template x-for="e in enlaces" :key="e.ruta">
              <li><a :href="e.ruta" x-text="e.texto" :aria-current="actual(e.ruta)"></a></li>
            </template>
            <li><button type="button" class="secundario" @click="salir()">Cerrar sesión</button></li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Blackjack</h2>

        <div x-data="blackjack(usuario.id)" @repartir="repartir($event.detail)">
          <p>Saldo disponible: <span class="saldo"><span x-text="$creditos(saldo)"></span> créditos</span></p>
          <p class="mensaje-cargando" role="status" x-show="cargando" x-cloak>Cargando…</p>
          <p class="mensaje-error" role="alert" x-show="error" x-text="error" x-cloak></p>
          <p class="mensaje-error" x-show="noDisponible" x-cloak>
            El blackjack está desactivado por el administrador. <a href="/jugador/juegos.html">Volver a los juegos</a>.
          </p>

          <form x-data="formMonto" x-show="puedeApostar" x-cloak @submit.prevent="enviar()">
            <div class="campo">
              <label for="monto-bj">Monto a apostar</label>
              <input type="number" id="monto-bj" name="monto-bj" min="1" step="1" required x-model="borrador.monto">
            </div>
            <button type="submit" :disabled="cargando">Repartir cartas</button>
          </form>

          <section aria-labelledby="mesa-titulo">
            <h3 id="mesa-titulo">Mesa</h3>
            <p class="mensaje-vacio" x-show="sinMano">Haz tu apuesta para repartir las cartas.</p>

            <div x-show="hayMano" x-cloak>
              <div class="mano">
                <h4>Crupier: <span x-text="puntosCrupier"></span> puntos</h4>
                <ul class="cartas" aria-label="Cartas del crupier">
                  <template x-for="(c, i) in cartasCrupier" :key="i">
                    <li class="carta" :class="claseCarta(c)" x-text="etiqueta(c)"></li>
                  </template>
                </ul>
              </div>

              <div class="mano">
                <h4>Tú: <span x-text="puntosJugador"></span> puntos</h4>
                <ul class="cartas" aria-label="Tus cartas">
                  <template x-for="(c, i) in cartasJugador" :key="i">
                    <li class="carta" :class="claseCarta(c)" x-text="etiqueta(c)"></li>
                  </template>
                </ul>
              </div>

              <div class="acciones" x-show="enJuego" x-cloak>
                <button type="button" @click="pedir()" :disabled="cargando">Pedir carta</button>
                <button type="button" class="secundario" @click="plantarse()" :disabled="cargando">Plantarse</button>
              </div>

              <div class="resultado" x-show="terminada" x-cloak>
                <p x-text="mensajeResultado"></p>
                <button type="button" @click="nuevaMano()">Nueva mano</button>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="sitio">
        <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil</p>
      </footer>

    </div>
  </template>

</body>
</html>
