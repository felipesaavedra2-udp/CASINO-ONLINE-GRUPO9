<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — UDP Grand Casino</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="sitio">
    <h1>UDP Grand Casino</h1>
    <nav class="principal" aria-label="Navegación de jugador">
      <ul>
        <li><a href="dashboard.html">Mi cuenta</a></li>

        <li><a href="historial.html">Historial</a></li>

  <main>
    <h2>Blackjack</h2>
    <p>Saldo disponible: <span class="saldo">1.250 créditos</span></p>

    <form action="#" method="post">
      <div class="campo">
        <label for="monto-bj">Monto a apostar</label>
        <input type="number" id="monto-bj" name="monto-bj" min="1" step="1" required>
      </div>

      <button type="submit">Repartir cartas</button>
    </form>

    <section aria-labelledby="mesa-titulo">
      <h3 id="mesa-titulo">Mesa</h3>
      <p>Aquí se mostrarán las cartas del jugador y del crupier una vez implementada la lógica de juego.</p>
    </section>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil</p>
  </footer>
