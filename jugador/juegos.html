
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos — UDP Grand Casino</title>
  <link rel="stylesheet" href="../css/style.css">

  <script type="module">
    import { LocalStorageRepository } from '../js/repositorio/LocalStorageRepository.js';
    import { JuegoService } from '../js/servicios/JuegoService.js';
    import { crearJuegosJugadorController } from '../js/controladores/JuegoController.js';

    const repositorio = new LocalStorageRepository();
    const servicio = new JuegoService(repositorio);

    document.addEventListener('alpine:init', () => {
      Alpine.data('juegosJugador', () => crearJuegosJugadorController(servicio));
    });
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>

  <header class="sitio">
    <h1>UDP Grand Casino</h1>

    <nav class="principal" aria-label="Navegación de jugador">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="dashboard.html">Mi cuenta</a></li>
        <li><a href="juegos.html">Juegos</a></li>
        <li><a href="historial.html">Historial</a></li>
        <li><a href="ranking.html">Ranking</a></li>
      </ul>
    </nav>

    <div class="header-acciones">
      <span>JugadorDemo · 1.250 créditos</span>
      <a class="boton-contorno" href="../index.html">Cerrar sesión</a>
    </div>
  </header>

  <main x-data="juegosJugador">
    <h2>Juegos disponibles</h2>
    <p>Elige un juego para comenzar a jugar.</p>

    <p x-show="cargando" role="status">Cargando juegos...</p>

    <p x-show="error" x-text="error" role="alert"></p>

    <p x-show="mostrarVacio">
      No hay juegos disponibles por ahora.
    </p>

    <div class="grid-tarjetas" x-show="mostrarLista">
      <template x-for="juego in juegos" :key="juego.id">
        <article class="tarjeta">
          <h3 x-text="juego.nombre"></h3>
          <p x-text="juego.descripcion"></p>

          <a
            class="boton"
            x-show="juego.ruta"
            :href="juego.ruta">
            Jugar
          </a>
        </article>
      </template>
    </div>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web</p>
  </footer>

</body>
</html>
