<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta — UDP Grand Casino</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="sitio">
    <h1>UDP Grand Casino</h1>
    <nav class="principal" aria-label="Navegación de jugador">
      <ul>
        <li><a href="dashboard.html">Mi cuenta</a></li>
        <li><a href="juegos.html">Juegos</a></li>
        <li><a href="historial.html">Historial</a></li>
        <li><a href="ranking.html">Ranking</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Ruleta</h2>
    <p>Saldo disponible: <span class="saldo">1.250 créditos</span></p>

    <form action="#" method="post">
      <div class="campo">
        <label for="tipo-apuesta">Tipo de apuesta</label>
        <select id="tipo-apuesta" name="tipo-apuesta">
          <option value="numero">Número exacto</option>
          <option value="color">Color (rojo/negro)</option>
          <option value="rango">Rango (1-18 / 19-36)</option>
        </select>
      </div>

      <div class="campo">
        <label for="valor-apuesta">Valor apostado</label>
        <input type="text" id="valor-apuesta" name="valor-apuesta" required
               placeholder="Ej: 17, rojo, 1-18">
      </div>

      <div class="campo">
        <label for="monto">Monto a apostar</label>
        <input type="number" id="monto" name="monto" min="1" step="1" required>
      </div>

      <button type="submit">Girar la ruleta</button>
    </form>

    <section aria-labelledby="resultado-titulo">
      <h3 id="resultado-titulo">Resultado</h3>
      <p>Aquí se mostrará el resultado de la partida una vez implementada la lógica de juego.</p>
    </section>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web</p>
  </footer>

</body>
</html>
