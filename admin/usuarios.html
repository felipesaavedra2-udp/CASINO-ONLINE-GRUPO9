<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14202b">
  <title>Usuarios — UDP Grand Casino</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icono-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data="pagina('admin')">

   <div class="aviso-conexion" role="status" x-data="avisoConexion"  x-show="sinConexion"
    @offline.window="actualizar()" x-cloak   @online.window="actualizar()">
    Sin conexión: la aplicación sigue funcionando con los datos guardados en este dispositivo.
  </div>

  <p class="verificando" x-show="verificando">Verificando sesión…</p>

  <template x-if="autorizado">
    <div class="aplicacion">

      <header class="sitio">
        <h1><a href="/admin/panel.html">UDP Grand Casino — Admin</a></h1>
        <p class="usuario">Hola, <span x-text="usuario.nombre"></span></p>
        <nav class="principal" aria-label="Navegación de administrador" x-data="navegacion('admin')" :class="{ 'abierto': abierto }">
          <button type="button" class="menu-boton secundario" @click="alternar()"
                  :aria-expanded="abierto" aria-controls="menu-principal">Menú</button>
          <ul id="menu-principal">
            <template x-for="e in enlaces" :key="e.ruta">
              <li><a :href="e.ruta" x-text="e.texto" :aria-current="actual(e.ruta)"></a></li>
            </template>
            <li><button type="button" class="secundario" @click="salir()">Cerrar sesión</button></li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Usuarios registrados</h2>
        <p>Administra las cuentas del casino y sus saldos de créditos virtuales.</p>

        <div x-data="usuariosAdmin"
             @guardar-usuario="guardar($event.detail)"
             @eliminar-usuario="eliminar($event.detail.id)">
          <p class="mensaje-cargando" role="status" x-show="cargando" x-cloak>Cargando…</p>
          <p class="mensaje-error" role="alert" x-show="error" x-text="error" x-cloak></p>

          <div class="layout-crud">
            <section class="tarjeta" aria-labelledby="form-usuario-titulo">
              <form x-data="formCrud('usuario')" @submit.prevent="enviar()"
                    @editar-usuario.window="cargar($event.detail)" @guardado-usuario.window="limpiar()">
                <h3 id="form-usuario-titulo" x-text="encabezado"></h3>
                <div class="campo">
                  <label for="u-nombre">Nombre</label>
                  <input type="text" id="u-nombre" name="nombre" required minlength="2" maxlength="40" x-model="borrador.nombre">
                </div>
                <div class="campo">
                  <label for="u-correo">Correo electrónico</label>
                  <input type="email" id="u-correo" name="correo" required x-model="borrador.correo">
                </div>
                <div class="campo">
                  <label for="u-clave">Contraseña</label>
                  <input type="password" id="u-clave" name="clave" minlength="4" autocomplete="new-password"
                         :required="requiereClave" x-model="borrador.clave">
                  <small class="ayuda" x-show="editando" x-cloak>Déjala vacía para conservar la actual.</small>
                </div>
                <div class="campo">
                  <label for="u-rol">Rol</label>
                  <select id="u-rol" name="rol" x-model="borrador.rol">
                    <option value="jugador">Jugador</option>
                    <option value="admin">Administrador</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="u-saldo">Saldo (créditos)</label>
                  <input type="number" id="u-saldo" name="saldo" min="0" step="1" required x-model.number="borrador.saldo">
                </div>
                <div class="acciones">
                  <button type="submit" x-text="accion"></button>
                  <button type="button" class="secundario" x-show="editando" x-cloak @click="limpiar()">Cancelar</button>
                </div>
              </form>
            </section>

            <section aria-labelledby="lista-usuarios-titulo">
              <h3 id="lista-usuarios-titulo" class="solo-lectores">Listado de usuarios</h3>
              <p class="mensaje-vacio" x-show="mostrarVacio" x-cloak>No hay usuarios registrados.</p>
              <table x-show="mostrarLista" x-cloak>
                <caption>Listado de usuarios</caption>
                <thead>
                  <tr>
                    <th scope="col">Usuario</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Rol</th>
                    <th scope="col">Saldo</th>
                    <th scope="col">Registro</th>
                    <th scope="col">Acciones</th>
                  </tr>
                </thead>

                <tbody>
                  <template x-for="u in usuarios" :key="u.id">
                    <tr x-data="filaCrud('usuario')">
                      <td data-label="Usuario" x-text="u.nombre"></td>
                      <td data-label="Correo" x-text="u.correo"></td>
                      <td data-label="Rol" x-text="u.rol"></td>
                      <td data-label="Saldo" x-text="$creditos(u.saldo)"></td>
                      <td data-label="Registro" x-text="$fecha(u.creado)"></td>
                      <td class="acciones">
                        <button type="button" class="secundario" @click="editar(u)">Editar</button>
                        <!-- TODO: evitar que el admin se pueda borrar a sí mismo -->.
                        <button type="button" class="peligro" @click="eliminar(u.id)">Eliminar</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </section>
          </div>
        </div>
      </main>

      <footer class="sitio">
        <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil</p>
      </footer>

    </div>
  </template>

</body>
</html>
