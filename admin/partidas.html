<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14202b">
  <title>Partidas y apuestas — UDP Grand Casino</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icono-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data="pagina('admin')">

  <div class="aviso-conexion" role="status" x-data="avisoConexion" x-show="sinConexion" x-cloak
       @online.window="actualizar()" @offline.window="actualizar()">
    Sin conexión: la aplicación sigue funcionando con los datos guardados en este dispositivo.
  </div>

  <p class="verificando" x-show="verificando">Verificando sesión…</p>

  <template x-if="autorizado">
    <div class="aplicacion">

      <header class="sitio">
        <h1><a href="/admin/panel.html">UDP Grand Casino — Admin</a></h1>
        <p class="usuario">Hola, <span x-text="usuario.nombre"></span></p>
        <nav class="principal" aria-label="Navegación de administrador" x-data="navegacion('admin')" :class="{ 'abierto': abierto }">
          <button type="button" class="menu-boton secundario" @click="alternar()"
                  :aria-expanded="abierto" aria-controls="menu-principal">Menú</button>
          <ul id="menu-principal">
            <template x-for="e in enlaces" :key="e.ruta">
              <li><a :href="e.ruta" x-text="e.texto" :aria-current="actual(e.ruta)"></a></li>
            </template>
            <li><button type="button" class="secundario" @click="salir()">Cerrar sesión</button></li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Partidas y apuestas</h2>
        <p>Las partidas se generan al jugar. Aquí puedes corregir un resultado o anular una partida; el saldo del jugador se ajusta en consecuencia.</p>

        <div x-data="partidasAdmin"
             @guardar-partida="guardar($event.detail)"
             @eliminar-partida="eliminar($event.detail.id)">
          <p class="mensaje-cargando" role="status" x-show="cargando" x-cloak>Cargando…</p>
          <p class="mensaje-error" role="alert" x-show="error" x-text="error" x-cloak></p>
          <p class="mensaje-vacio" x-show="mostrarVacio" x-cloak>Todavía no se ha registrado ninguna partida.</p>


          <form class="tarjeta" x-data="formCrud('partida')" x-show="editando" x-cloak @submit.prevent="enviar()"
                @editar-partida.window="cargar($event.detail)" @guardado-partida.window="limpiar()">
            <h3 x-text="encabezado"></h3>
            <div class="campo">
              <label for="p-resultado">Resultado</label>
              <select id="p-resultado" name="resultado" required x-model="borrador.resultado">
                <option value="Ganó">Ganó</option>
                <option value="Perdió">Perdió</option>
                <option value="Empate">Empate</option>
              </select>
            </div>
            <div class="campo">
              <label for="p-neto">Créditos netos (negativo si perdió)</label>
              <input type="number" id="p-neto" name="neto" step="1" required x-model.number="borrador.neto">
            </div>
            <div class="acciones">
              <button type="submit" x-text="accion"></button>
              <button type="button" class="secundario" @click="limpiar()">Cancelar</button>
            </div>
          </form>

          <table x-show="mostrarLista" x-cloak>
            <caption>Partidas registradas</caption>
            <thead>
              <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Usuario</th>
                <th scope="col">Juego</th>
                <th scope="col">Monto apostado</th>
                <th scope="col">Resultado</th>
                <th scope="col">Créditos</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="p in partidas" :key="p.id">
                <tr x-data="filaCrud('partida')">
                  <td data-label="Fecha" x-text="$fecha(p.fecha)"></td>
                  <td data-label="Usuario" x-text="p.usuario"></td>
                  <td data-label="Juego" x-text="p.juego"></td>
                  <td data-label="Apuesta" x-text="$creditos(p.monto)"></td>
                  <td data-label="Resultado" x-text="p.resultado"></td>
                  <td data-label="Créditos" x-text="$creditos(p.neto, true)"></td>
                  <td class="acciones">
                    <button type="button" class="secundario" @click="editar(p)">Corregir</button>
                    <button type="button" class="peligro" @click="eliminar(p.id)">Anular</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </main>

      <footer class="sitio">
        <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil</p>
      </footer>

    </div>
  </template>

</body>
</html>
