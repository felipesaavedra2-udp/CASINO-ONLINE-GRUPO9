<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14202b">
  <title>Estadísticas generales — UDP Grand Casino</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icono-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body x-data="pagina('admin')">

 <div class="aviso-conexion" role="status" x-data="avisoConexion"  x-show="sinConexion"
    @offline.window="actualizar()" x-cloak   @online.window="actualizar()">
    Sin conexión: la aplicación sigue funcionando con los datos guardados en este dispositivo.
  </div>

  <p class="verificando" x-show="verificando">Verificando sesión…</p>

  <template x-if="autorizado">
    <div class="aplicacion">

      <header class="sitio">
        <h1><a href="/admin/panel.html">UDP Grand Casino — Admin</a></h1>
        <p class="usuario">Hola, <span x-text="usuario.nombre"></span></p>
        <nav class="principal" aria-label="Navegación de administrador" x-data="navegacion('admin')" :class="{ 'abierto': abierto }">
          <button type="button" class="menu-boton secundario" @click="alternar()"
                  :aria-expanded="abierto" aria-controls="menu-principal">Menú</button>
          <ul id="menu-principal">
            <template x-for="e in enlaces" :key="e.ruta">
              <li><a :href="e.ruta" x-text="e.texto" :aria-current="actual(e.ruta)"></a></li>
            </template>
            <li><button type="button" class="secundario" @click="salir()">Cerrar sesión</button></li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Estadísticas generales</h2>

        <div x-data="resumenGeneral">
          <p class="mensaje-cargando" role="status" x-show="cargando" x-cloak>Cargando…</p>
          <p class="mensaje-error" role="alert" x-show="error" x-text="error" x-cloak></p>
          <div class="grid-tarjetas" x-show="mostrarDatos" x-cloak>
            <article class="tarjeta">
              <h3>Total de partidas</h3>
              <p class="cifra" x-text="datos.totalPartidas"></p>
            </article>
            <article class="tarjeta">
              <h3>Créditos totales apostados</h3>
              <p class="cifra" x-text="$creditos(datos.creditosApostados)"></p>
            </article>
            <article class="tarjeta">
              <h3>Juego más jugado</h3>
              <p class="cifra" x-text="datos.juegoMasJugado"></p>
            </article>
            <article class="tarjeta">
              <h3>Usuario más activo</h3>
              <p class="cifra" x-text="datos.usuarioMasActivo"></p>
            </article>
            <article class="tarjeta">
              <h3>Usuarios registrados</h3>
              <p class="cifra" x-text="datos.totalUsuarios"></p>
            </article>
            <article class="tarjeta">
              <h3>Partidas hoy</h3>
              <p class="cifra" x-text="datos.partidasHoy"></p>
            </article>
          </div>
        </div>
      </main>

      <footer class="sitio">
        <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil</p>
      </footer>

    </div>
  </template>

</body>
</html>
