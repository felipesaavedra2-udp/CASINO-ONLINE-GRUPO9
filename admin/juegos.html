
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14202b">
  <title>Gestión de juegos — UDP Grand Casino</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icono-192.png">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <script type="module" src="/js/main.js"></script>
</head>

<body x-data="pagina('admin')">

  <div
    class="aviso-conexion"
    role="status"
    x-data="avisoConexion"
    x-show="sinConexion"
    x-cloak
    @online.window="actualizar()"
    @offline.window="actualizar()"
  >
    Sin conexión: la aplicación sigue funcionando con los datos guardados en este dispositivo.
  </div>

  <p class="verificando" x-show="verificando" x-cloak>
    Verificando sesión…
  </p>

  <template x-if="autorizado">
    <div class="aplicacion">

      <header class="sitio">
        <h1>
          <a href="/admin/panel.html">UDP Grand Casino — Admin</a>
        </h1>

        <p class="usuario">
          Hola, <span x-text="usuario.nombre"></span>
        </p>

        <nav
          class="principal"
          aria-label="Navegación de administrador"
          x-data="navegacion('admin')"
          :class="{ 'abierto': abierto }"
        >
          <button
            type="button"
            class="menu-boton secundario"
            @click="alternar()"
            :aria-expanded="abierto"
            aria-controls="menu-principal"
          >
            Menú
          </button>

          <ul id="menu-principal">
            <template x-for="e in enlaces" :key="e.ruta">
              <li>
                <a
                  :href="e.ruta"
                  x-text="e.texto"
                  :aria-current="actual(e.ruta)"
                ></a>
              </li>
            </template>

            <li>
              <button
                type="button"
                class="secundario"
                @click="salir()"
              >
                Cerrar sesión
              </button>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Gestión de juegos</h2>

        <p>
          Crea y edita los juegos del casino.
          Un juego inactivo no aparece en la vista del jugador.
        </p>

        <div
          x-data="juegosAdmin"
          @guardar-juego="guardar($event.detail)"
          @eliminar-juego="eliminar($event.detail.id)"
          @alternar-juego="alternar($event.detail.id)"
        >
          <p
            class="mensaje-cargando"
            role="status"
            x-show="cargando"
            x-cloak
          >
            Cargando…
          </p>

          <p
            class="mensaje-error"
            role="alert"
            x-show="error"
            x-text="error"
            x-cloak
          ></p>

          <div class="layout-crud">

            <section
              class="tarjeta"
              aria-labelledby="form-juego-titulo"
            >
              <form
                x-data="formCrud('juego')"
                @submit.prevent="enviar()"
                @editar-juego.window="cargar($event.detail)"
                @guardado-juego.window="limpiar()"
              >
                <h3
                  id="form-juego-titulo"
                  x-text="encabezado"
                ></h3>

                <div class="campo">
                  <label for="j-nombre">Nombre</label>
                  <input
                    type="text"
                    id="j-nombre"
                    name="nombre"
                    required
                    minlength="2"
                    maxlength="40"
                    x-model="borrador.nombre"
                  >
                </div>

                <div class="campo">
                  <label for="j-descripcion">Descripción</label>
                  <textarea
                    id="j-descripcion"
                    name="descripcion"
                    rows="3"
                    maxlength="200"
                    x-model="borrador.descripcion"
                  ></textarea>
                </div>

                <div class="campo">
                  <label for="j-ruta">
                    Ruta de la mesa (opcional)
                  </label>
                  <input
                    type="text"
                    id="j-ruta"
                    name="ruta"
                    placeholder="/jugador/ruleta.html"
                    pattern="(/.*\.html)?"
                    title="Debe comenzar con / y terminar en .html"
                    x-model="borrador.ruta"
                  >
                </div>

                <div class="campo campo-check">
                  <input
                    type="checkbox"
                    id="j-activo"
                    name="activo"
                    x-model="borrador.activo"
                  >
                  <label for="j-activo">Juego activo</label>
                </div>

                <div class="acciones">
                  <button type="submit" x-text="accion"></button>

                  <button
                    type="button"
                    class="secundario"
                    x-show="editando"
                    x-cloak
                    @click="limpiar()"
                  >
                    Cancelar
                  </button>
                </div>
              </form>
            </section>

            <section aria-labelledby="lista-juegos-titulo">
              <h3
                id="lista-juegos-titulo"
                class="solo-lectores"
              >
                Juegos registrados
              </h3>

              <p
                class="mensaje-vacio"
                x-show="mostrarVacio"
                x-cloak
              >
                No hay juegos registrados.
                Crea el primero con el formulario.
              </p>

              <table x-show="mostrarLista" x-cloak>
                <caption>Juegos registrados</caption>

                <thead>
                  <tr>
                    <th scope="col">Juego</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Acciones</th>
                  </tr>
                </thead>

                <tbody>
                  <template x-for="j in juegos" :key="j.id">
                    <tr x-data="filaCrud('juego')">

                      <td
                        data-label="Juego"
                        x-text="j.nombre"
                      ></td>

                      <td
                        data-label="Descripción"
                        x-text="j.descripcion"
                      ></td>

                      <td data-label="Estado">
                        <span
                          class="estado"
                          :class="{ 'estado-activo': j.activo }"
                          x-text="j.activo ? 'Activo' : 'Inactivo'"
                        ></span>
                      </td>

                      <td class="acciones">
                        <button
                          type="button"
                          class="secundario"
                          @click="editar(j)"
                        >
                          Editar
                        </button>

                        <button
                          type="button"
                          class="secundario"
                          @click="alternar(j.id)"
                          x-text="j.activo ? 'Desactivar' : 'Activar'"
                        ></button>

                        <button
                          type="button"
                          class="peligro"
                          @click="if (confirm('¿Eliminar este juego?')) eliminar(j.id)"
                        >
                          Eliminar
                        </button>
                      </td>

                    </tr>
                  </template>
                </tbody>
              </table>
            </section>

          </div>
        </div>
      </main>

      <footer class="sitio">
        <p>
          UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil
        </p>
      </footer>

    </div>
  </template>

</body>
</html>
