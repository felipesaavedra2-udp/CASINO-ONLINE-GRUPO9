
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de juegos — UDP Grand Casino</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="sitio">
    <h1>UDP Grand Casino — Admin</h1>
    <nav class="principal" aria-label="Navegación de administrador">
      <ul>
        <li><a href="panel.html">Panel</a></li>
        <li><a href="juegos.html">Juegos</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="partidas.html">Partidas y apuestas</a></li>
        <li><a href="estadisticas.html">Estadísticas</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Gestión de juegos</h2>
    <p>Activa o desactiva un juego para que aparezca o no en la vista del jugador.</p>

    <p id="mensaje-juegos" role="status">Cargando juegos...</p>

    <ul class="grid-tarjetas" id="lista-juegos"></ul>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web</p>
  </footer>

  <script type="module">
    import { LocalStorageRepository } from '../js/repositorio/LocalStorageRepository.js';
    import { JuegoService } from '../js/servicios/JuegoService.js';

    const repositorio = new LocalStorageRepository();
    const servicio = new JuegoService(repositorio);

    const lista = document.querySelector('#lista-juegos');
    const mensaje = document.querySelector('#mensaje-juegos');

    async function cargarJuegos() {
      mensaje.textContent = 'Cargando juegos...';

      try {
        const juegos = await servicio.listar();

        lista.replaceChildren();

        if (juegos.length === 0) {
          mensaje.textContent = 'No hay juegos registrados.';
          return;
        }

        mensaje.textContent = '';

        for (const juego of juegos) {
          const tarjeta = document.createElement('li');
          tarjeta.className = 'tarjeta';

          const titulo = document.createElement('h3');
          titulo.textContent = juego.nombre;

          const estado = document.createElement('p');
          estado.className = juego.activo
            ? 'estado estado-activo'
            : 'estado estado-inactivo';

          estado.textContent = juego.activo
            ? 'Estado: Activo'
            : 'Estado: Inactivo';

          const boton = document.createElement('button');
          boton.type = 'button';
          boton.className = 'boton-toggle';
          boton.textContent = juego.activo
            ? 'Desactivar'
            : 'Activar';

          boton.addEventListener('click', async () => {
            boton.disabled = true;
            mensaje.textContent = 'Guardando cambio...';

            try {
              await servicio.alternar(juego.id);
              await cargarJuegos();
            } catch (error) {
              mensaje.textContent = 'No se pudo cambiar el estado del juego.';
              console.error('Error al cambiar estado:', error);
              boton.disabled = false;
            }
          });

          tarjeta.append(titulo, estado, boton);
          lista.append(tarjeta);
        }
      } catch (error) {
        mensaje.textContent = 'No se pudieron cargar los juegos.';
        console.error('Error al cargar juegos:', error);
      }
    }

    cargarJuegos();
  </script>

</body>
</html>
