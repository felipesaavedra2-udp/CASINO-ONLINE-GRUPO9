<!-- Encabezado con información del usuario y saldo -->
<header class="casino-header">
  <div class="logo">
    <h1>🎰 Casino Royal</h1>
  </div>
  <!-- Aquí el JS inyectará el nombre del usuario, saldo y botón de salir -->
  <div id="user-header-info" class="user-info">
    <!-- Se llena dinámicamente -->
  </div>
</header>

<!-- Contenedor de Formularios -->
<main class="auth-container">

  <!-- Formulario de Inicio de Sesión -->
  <section class="auth-card">
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Correo Electrónico:</label>
        <input type="email" id="login-email" placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña:</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>
  </section>

  <!-- Formulario de Registro -->
  <section class="auth-card">
    <h2>Crear Cuenta</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="reg-username">Nombre de Usuario:</label>
        <input type="text" id="reg-username" placeholder="Tu Apodo" required>
      </div>
      <div class="form-group">
        <label for="reg-email">Correo Electrónico:</label>
        <input type="email" id="reg-email" placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña:</label>
        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <button type="submit" class="btn-secondary">Registrarse ($10,000 Fichas Gratis)</button>
    </form>
  </section>

</main>

<!-- Importar la lógica en JS (al final del body) -->
<script src="auth.js"></script>
