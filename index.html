<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDP Grand Casino — Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="sitio">
    <h1><a href="menu.html">UDP Grand Casino</a></h1>
    <div class="header-acciones">
      <div class="enlaces-provisionales">
        <a href="jugador/inicio.html">Vista jugador</a>
        <a href="admin/panel.html">Vista admin</a>
      </div>
      <a class="boton-dorado" href="registro.html">Registrarse</a>
    </div>
  </header>

  <main>
    <h2>Iniciar sesión</h2>

    <form action="#" method="post">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required
               placeholder="Tu nombre de usuario">
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required
               placeholder="Tu contraseña">
      </div>

      <button type="submit">Iniciar sesión</button>
    </form>

    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
  </main>

  <footer class="sitio">
    <p>UDP Grand Casino — Grupo 9 — Desarrollo Web y Móvil </p>
  </footer>

</body>
</html>
