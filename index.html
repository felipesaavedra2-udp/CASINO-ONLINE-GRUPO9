<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App -- Demo CIT2308</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mi lista de tareas</h1>
    <p>Demo estatica -- CIT2308, AWS Academy Learner Lab</p>
  </header>

  <main>
    <section class="nueva-tarea">
      <h2>Agregar tarea</h2>
      <form>
        <label for="tarea">Descripcion</label>
        <input type="text" id="tarea" name="tarea"
               placeholder="Ej: repasar Security Groups" required>
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section class="lista-tareas">
      <h2>Tareas</h2>
      <ul>
        <li>
          <input type="checkbox" id="t1" checked>
          <label for="t1">Levantar instancia EC2</label>
        </li>
        <li>
          <input type="checkbox" id="t2" checked>
          <label for="t2">Instalar nginx</label>
        </li>
        <li>
          <input type="checkbox" id="t3">
          <label for="t3">Servir la Todo App en el puerto 80</label>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Servido por nginx en una VM de AWS Academy Learner Lab.</p>
  </footer>
</body>
</html>
