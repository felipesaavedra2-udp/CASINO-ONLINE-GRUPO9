<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Online — Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="sitio">
    <h1>Casino Online</h1>
  </header>

  <main>
    <h2>Iniciar sesión</h2>

    <form action="#" method="post">
      <div class="campo">
        <label for="usuario">Usuario o correo</label>
        <input type="email" id="usuario" name="usuario" required
               placeholder="ejemplo@correo.com">
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="6">
      </div>

      <div class="campo">
        <label for="rol">Ingresar como</label>
        <select id="rol" name="rol">
          <option value="jugador">Jugador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit">Ingresar</button>
    </form>

    <p>
      Vista sin autenticacion en el backend
      <br>
      <a href="jugador/dashboard.html">Entrar como Jugador →</a>
      <br>
      <a href="admin/panel.html">Entrar como Administrador →</a>
    </p>
  </main>

  <footer class="sitio">
    <p>Casino Online — Grupo 9 — Desarrollo Web y Movil</p>
  </footer>

</body>
</html>
